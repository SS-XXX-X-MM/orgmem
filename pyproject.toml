[project]
name = "orgmem"
version = "0.1.0"
description = "Turn scattered team knowledge into one shared, cited, self-consolidating memory that every AI tool in your organisation can read."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Shubham Sharma" }]
keywords = ["llm", "memory", "knowledge-management", "mcp", "claude"]
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]

[project.scripts]
orgmem = "orgmem.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orgmem"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
